<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KETTEN V2.0 - Organic Hardware</title>
    <style>
        :root {
            --bg-color: #000000;
            --glow: rgba(132, 212, 150, 0.15);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: #84d496;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
        }

        #container {
            display: inline-block;
            position: relative;
            transform-origin: center center;
            will-change: transform;
            white-space: nowrap;
        }

        pre#screen {
            margin: 0;
            padding: 0;
            font-size: 16px;
            line-height: 16px;
            letter-spacing: 0px;
            font-weight: normal;
            color: #84d496;
            text-shadow: 0 0 5px var(--glow);
            user-select: none;
            -webkit-user-select: none;
            white-space: pre !important;
            word-break: keep-all !important;
            overflow: visible;
        }

        .haze {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95);
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="container">
        <div class="haze"></div>
        <pre id="screen"></pre>
    </div>

<script>
/**
 * ----------------------------------------------------
 * KETTEN ASCII ENGINE - ORGANIC HARDWARE (ARCH/CROWN)
 * ----------------------------------------------------
 */

const WIDTH = 92;
const HEIGHT = 30;

const chars = new Array(WIDTH * HEIGHT).fill(' ');
const colors = new Array(WIDTH * HEIGHT).fill('');

const PALETTE = {
    BG: '#000000',
    LOG_DIM: '#0a1c0a',
    LOG_MID: '#103310',
    STALK: '#1c4d23',
    BRANCH: '#2d6b38',
    LEAF: '#58a867',
    LOGO_BASE: '#65b376',
    LOGO_HIGH: '#c2f2ce',
    LIGHT_DIM: '#4a0b38',
    LIGHT_MID: '#9c1976',
    LIGHT_HIGH: '#e83ab8'
};

const LOGO = [
    "  _  __ ______ _______ _______ ______ _   _  ",
    " | |/ /|  ____|__   __|__   __|  ____| \\ | | ",
    " | ' / | |__     | |     | |  | |__  |  \\| | ",
    " |  <  |  __|    | |     | |  |  __| | . ` | ",
    " | . \\ | |____   | |     | |  | |____| |\\  | ",
    " |_|\\_\\|______|  |_|     |_|  |______|_| \\_| "
];

const MOCKUP_LOGS = [
    "RP2040 init... OK",
    "Mounting LittleFS...",
    "6-channel PWM LED controller active",
    "Loading 24-hour spectral recipe...",
    "Capacitive touch module ready",
    "Web Serial CLI listening...",
    "VPD target locked: 1.15 kPa",
    "Thermal limit within safe bounds (< 45C).",
    "Syncing RTC via NTP..."
];

let activeLogs = [];
let logTimer = 0;
let t = 0;
let flora = [];
let branchPhases = [];
let branchGroupId = 1;

function addFloraNode(x, y, char, type, color, branchGroup = 0) {
    flora.push({
        baseX: x, baseY: y, char: char, type: type, color: color,
        phase: Math.random() * Math.PI * 2, branchGroup: branchGroup
    });
}

function getBezierPoint(t, p0, p1, p2, p3) {
    let cX = 3 * (p1.x - p0.x), bX = 3 * (p2.x - p1.x) - cX, aX = p3.x - p0.x - cX - bX;
    let cY = 3 * (p1.y - p0.y), bY = 3 * (p2.y - p1.y) - cY, aY = p3.y - p0.y - cY - bY;
    let x = (aX * Math.pow(t, 3)) + (bX * Math.pow(t, 2)) + (cX * t) + p0.x;
    let y = (aY * Math.pow(t, 3)) + (bY * Math.pow(t, 2)) + (cY * t) + p0.y;
    return {x: x, y: y};
}

function getChar(dx, dy) {
    if (dx === 0) return '|';
    if (dy === 0) return '_';
    if ((dx > 0 && dy > 0) || (dx < 0 && dy < 0)) return '\\';
    if ((dx > 0 && dy < 0) || (dx < 0 && dy > 0)) return '/';
    return '*';
}

function generateVinePath(p0, p1, p2, p3, isLeft) {
    let lastX = -1, lastY = -1;

    for (let t = 0; t <= 1.0; t += 0.005) {
        let pt = getBezierPoint(t, p0, p1, p2, p3);
        let x = Math.round(pt.x);
        let y = Math.round(pt.y);

        if (x !== lastX || y !== lastY) {
            let char = '|';
            if (lastX !== -1) {
                let dx = x - lastX;
                let dy = y - lastY;
                char = getChar(dx, dy);
            }

            addFloraNode(x, y, char, 'stalk', PALETTE.STALK, 0);

            if (Math.random() > 0.82 && y > 3 && y < HEIGHT - 2) {
                let branchLen = 2 + Math.floor(Math.random() * 4);
                let bDir = isLeft ? (Math.random() > 0.25 ? -1 : 1) : (Math.random() > 0.25 ? 1 : -1);

                let bx = x;
                let by = y;
                branchPhases[branchGroupId] = Math.random() * Math.PI * 2;

                for (let b = 1; b <= branchLen; b++) {
                    bx += bDir;
                    if (b % 2 === 0) by -= 1;

                    let bChar = (bDir === 1) ? (b % 2 === 0 ? '/' : '_') : (b % 2 === 0 ? '\\' : '_');
                    addFloraNode(bx, by, bChar, 'branch', PALETTE.BRANCH, branchGroupId);

                    if (Math.random() > 0.3) {
                        addFloraNode(bx, by - 1, '~', 'leaf', PALETTE.LEAF, branchGroupId);
                    }

                    if (b === branchLen || (b > 2 && Math.random() > 0.8)) {
                        addFloraNode(bx + bDir, by, '¤', 'light', PALETTE.LIGHT_MID, branchGroupId);
                    }
                }
                branchGroupId++;
            }

            lastX = x;
            lastY = y;
        }
    }
}

function initFlora() {
    flora = [];
    branchPhases = [0];
    branchGroupId = 1;

    let leftP0 = {x: 43, y: 29};
    let leftP1 = {x: 2, y: 27};
    let leftP2 = {x: 6, y: 3};
    let leftP3 = {x: 41, y: 2};
    generateVinePath(leftP0, leftP1, leftP2, leftP3, true);

    let rightP0 = {x: 48, y: 29};
    let rightP1 = {x: 89, y: 27};
    let rightP2 = {x: 85, y: 3};
    let rightP3 = {x: 50, y: 2};
    generateVinePath(rightP0, rightP1, rightP2, rightP3, false);
}

function putChar(x, y, char, color) {
    x = Math.floor(x);
    y = Math.floor(y);
    if (x >= 0 && x < WIDTH && y >= 0 && y < HEIGHT) {
        const idx = y * WIDTH + x;
        chars[idx] = char;
        colors[idx] = color;
    }
}

function clearScreen() {
    chars.fill(' ');
    colors.fill(PALETTE.BG);
}

function drawLogs() {
    logTimer++;
    if (logTimer > 90 && Math.random() > 0.3) {
        activeLogs.push({
            text: "> " + MOCKUP_LOGS[Math.floor(Math.random() * MOCKUP_LOGS.length)],
            y: HEIGHT + 1
        });
        logTimer = 0;
    }

    for (let i = activeLogs.length - 1; i >= 0; i--) {
        let log = activeLogs[i];
        log.y -= 0.04;

        if (log.y < -2) {
            activeLogs.splice(i, 1);
            continue;
        }

        let py = Math.floor(log.y);
        if (py >= 0 && py < HEIGHT) {
            let col = py < 6 ? PALETTE.LOG_DIM : PALETTE.LOG_MID;
            let startX = Math.floor((WIDTH - log.text.length) / 2);
            for (let c = 0; c < log.text.length; c++) {
                putChar(startX + c, py, log.text[c], col);
            }
        }
    }
}

const leafChars = ['\\', '/', '~', '-', '"', '\'', '`'];
function drawFlora() {
    for (let node of flora) {
        let cx = node.baseX;
        let cy = node.baseY;
        let c = node.char;
        let col = node.color;

        if (node.branchGroup > 0) {
            let windPhase = branchPhases[node.branchGroup];
            let breeze = Math.sin(t * 0.015 + windPhase);
            if (breeze > 0.6) {
                let offset = Math.round((breeze - 0.6) * 3);
                cx += offset;
                if (breeze > 0.8) cy -= 1;
            }
        }

        if (node.type === 'leaf') {
            let leafIdx = Math.floor((t * 0.08 + node.phase * 5) % leafChars.length);
            c = leafChars[leafIdx];
        } else if (node.type === 'light') {
            let pulse = Math.sin(t * 0.04 + node.phase);
            if (pulse > 0.7) {
                c = '¤'; col = PALETTE.LIGHT_HIGH;
            } else if (pulse > 0) {
                c = '*'; col = PALETTE.LIGHT_MID;
            } else {
                c = '.'; col = PALETTE.LIGHT_DIM;
            }
        }
        putChar(cx, cy, c, col);
    }
}

function drawLogo() {
    let startX = Math.floor((WIDTH - LOGO[0].length) / 2);
    let floatY = Math.sin(t * 0.02) * 1.2;
    let startY = Math.floor(HEIGHT / 2 - LOGO.length / 2 + floatY);

    for (let y = 0; y < LOGO.length; y++) {
        for (let x = 0; x < LOGO[y].length; x++) {
            let c = LOGO[y][x];
            if (c !== ' ' && c !== '_') {
                let col = (y < 3) ? PALETTE.LOGO_HIGH : PALETTE.LOGO_BASE;
                putChar(startX + x, startY + y, c, col);
            } else if (c === '_') {
                 putChar(startX + x, startY + y, c, PALETTE.STALK);
            }
        }
    }
}

function flushToScreen() {
    let html = '';
    let lastColor = null;

    for (let y = 0; y < HEIGHT; y++) {
        for (let x = 0; x < WIDTH; x++) {
            let idx = y * WIDTH + x;
            let c = chars[idx];
            let col = colors[idx];

            if (c === ' ') {
                if (lastColor !== null) { html += '</span>'; lastColor = null; }
                html += ' ';
            } else {
                if (col !== lastColor) {
                    if (lastColor !== null) html += '</span>';
                    html += `<span style="color:${col}">`;
                    lastColor = col;
                }

                if (c === '<') html += '&lt;';
                else if (c === '>') html += '&gt;';
                else if (c === '&') html += '&amp;';
                else html += c;
            }
        }
        if (lastColor !== null) { html += '</span>'; lastColor = null; }
        html += '\n';
    }
    document.getElementById('screen').innerHTML = html;
}

function renderLoop() {
    clearScreen();
    drawLogs();
    drawFlora();
    drawLogo();

    flushToScreen();
    t++;
    requestAnimationFrame(renderLoop);
}

function handleResize() {
    const container = document.getElementById('container');
    container.style.transform = 'scale(1)';
    const rect = container.getBoundingClientRect();
    const scale = Math.min(window.innerWidth / rect.width, window.innerHeight / rect.height) * 0.95;
    container.style.transform = `scale(${scale})`;
}

initFlora();
window.addEventListener('resize', handleResize);
setTimeout(handleResize, 50);
renderLoop();
</script>
</body>
</html>
